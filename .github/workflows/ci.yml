name: CI
on:
  # Paths that can never change behaviour are ignored. NOT ignored on purpose: nothing under design/ (tests/unit/ui/logo.test.ts
  # reads design/logo/*.svg) and no other path any test or script reads.
  pull_request:
    paths-ignore:
      - '.claude/**'
      - 'docs/**'
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '.claude/**'
      - 'docs/**'
      - '**.md'
  # Manual full pipeline (checks + both e2e shards): Actions tab -> CI -> Run workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maw3ed
          POSTGRES_PASSWORD: maw3ed
          POSTGRES_DB: maw3ed_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U maw3ed" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway values for CI only. Never put real secrets here.
      DATABASE_URL: postgresql://maw3ed:maw3ed@localhost:5432/maw3ed_test
      DIRECT_URL: postgresql://maw3ed:maw3ed@localhost:5432/maw3ed_test
      DATABASE_URL_TEST: postgresql://maw3ed:maw3ed@localhost:5432/maw3ed_test
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-only-session-secret-0000000000000000
      LINK_SECRET: ci-only-link-secret-000000000000000000
      CRON_SECRET: ci-only-cron-secret-0000000000000000
      EMAIL_PROVIDER: fake
      PAYMENT_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate (skipped until the Prisma schema lands)
        run: |
          if [ -f prisma/schema.prisma ]; then pnpm prisma migrate deploy; else echo "no schema yet"; fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit --passWithNoTests
      - run: pnpm test:int --passWithNoTests
      - run: pnpm build
      - name: OpenAPI contract
        run: |
          if [ -f scripts/openapi/check.ts ]; then pnpm openapi:check; else echo "no contract yet"; fi
      - name: i18n keys
        run: node scripts/i18n/check-keys.mjs

  # Browser flows: public specs on the Pixel 5 project, dashboard specs on dashboard-mobile, and the shell spec
  # at desktop width (layout at lg). Runs in parallel with `checks`. Specs mock /api, so Postgres is only needed
  # for the build and migrations to mirror `checks`.
  e2e:
    name: e2e (${{ matrix.shard }}/2)
    # Push to main skips the browser shards (they already ran on the pull request); PRs and manual runs run them.
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maw3ed
          POSTGRES_PASSWORD: maw3ed
          POSTGRES_DB: maw3ed_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U maw3ed" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway values for CI only. Never put real secrets here.
      DATABASE_URL: postgresql://maw3ed:maw3ed@localhost:5432/maw3ed_test
      DIRECT_URL: postgresql://maw3ed:maw3ed@localhost:5432/maw3ed_test
      DATABASE_URL_TEST: postgresql://maw3ed:maw3ed@localhost:5432/maw3ed_test
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-only-session-secret-0000000000000000
      LINK_SECRET: ci-only-link-secret-000000000000000000
      CRON_SECRET: ci-only-cron-secret-0000000000000000
      EMAIL_PROVIDER: fake
      PAYMENT_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma migrate deploy
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium with system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install system deps only (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        # apt mirrors were unreachable from the runners on 11 Nov 2026 ('Temporary failure resolving azure.archive.ubuntu.com'):
        # retry, then continue with the libraries already on the runner image (Chrome is preinstalled there). If one were
        # really missing, the browser launch in the next steps fails loudly.
        run: |
          for attempt in 1 2 3; do
            pnpm exec playwright install-deps chromium && exit 0
            echo "install-deps failed (attempt $attempt)"; sleep 20
          done
          echo "::warning::playwright install-deps failed; continuing with the libraries on the runner image"
      - run: pnpm build
      - name: Public and dashboard specs (mobile)
        run: pnpm exec playwright test --project=mobile --project=dashboard-mobile --shard=${{ matrix.shard }}/2
      - name: Dashboard shell at desktop width (shard 1 only)
        if: matrix.shard == 1
        run: pnpm exec playwright test --project=dashboard-desktop tests/e2e/dashboard/shell.spec.ts
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
