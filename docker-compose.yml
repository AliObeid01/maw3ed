services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: maw3ed
      POSTGRES_PASSWORD: maw3ed
      POSTGRES_DB: maw3ed_test
    ports:
      - '5432:5432'
    volumes:
      - maw3ed-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maw3ed -d maw3ed_test']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  maw3ed-pgdata:
